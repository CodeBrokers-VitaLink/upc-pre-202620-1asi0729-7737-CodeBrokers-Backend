environment.name=prod
spring.jpa.hibernate.ddl-auto=${DATABASE_DDL_AUTO:validate}
app.demo-data=false
spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT:3306}/${DATABASE_NAME:vitalink}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
